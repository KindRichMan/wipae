<style>
  :root{
    --ink:#2b1d12; --sub:#7a6f63; --line:#d8cfbe; --panel:#f3efe6;
    --accent:#8f2a20; --btn:#fff; --btnline:#c7bda9; --btnhover:#f0e9d8;
    --serif:"Batang","Nanum Myeongjo","AppleMyungjo","Noto Serif KR",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
       color:var(--ink);background:#e9e5db;display:flex;flex-direction:column;height:100vh;
       overflow:hidden;font-size:17px}
  header{background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;
         display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
  .modeTabs{display:flex;gap:6px;margin-left:6px}
  .modeTab,.styleTab{padding:9px 20px;border:1px solid var(--btnline);background:#fff;border-radius:999px;
           font-size:16px;font-weight:700;cursor:pointer}
  .modeTab.on,.styleTab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  header .sp{flex:1}
  .hbtn{padding:10px 16px;border:1px solid var(--btnline);background:#fff;border-radius:10px;
        font-size:16px;font-weight:600;cursor:pointer}
  .hbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

  .main{flex:1;display:flex;min-height:0}
  .stage{flex:1;min-width:0;overflow:auto;padding:26px;background:#ded9cd;
         display:flex;justify-content:center;align-items:flex-start}
  .stageInner{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-start}

  .panel{width:430px;max-width:48vw;background:var(--panel);border-left:1px solid var(--line);
         display:flex;flex-direction:column;min-height:0}
  .panel .scroll{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
  .grp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
  .grp h2{margin:0 0 12px;font-size:14px;color:var(--sub);font-weight:800;letter-spacing:.02em}
  .fld{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .fld label{width:78px;font-size:14px;color:var(--sub);flex-shrink:0}
  .fld input,.fld select{flex:1;padding:10px;border:1px solid var(--btnline);border-radius:9px;font-size:16px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{padding:11px 14px;border:1px solid var(--btnline);background:var(--btn);border-radius:10px;
       font-size:15px;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--btnhover)}
  .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.big{padding:14px 16px;font-size:19px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{padding:9px 14px;border:1px solid var(--btnline);background:#fff;border-radius:999px;
        font-size:15px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .dead{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#faf8f2}
  .dead .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .dead .top b{font-size:14px;color:var(--sub)}
  .miniX{border:none;background:none;color:var(--accent);font-weight:800;cursor:pointer;font-size:15px}
  .note{font-size:13px;color:var(--sub);line-height:1.55}
  .footer{padding:12px 16px;border-top:1px solid var(--line);background:#fff;display:flex;gap:10px}
  .footer .btn{flex:1}

  /* ===== 위패(벡터 프레임 + 글자) ===== */
  .frame{position:relative;container-type:inline-size}
  .frame.main{width:min(360px,84vw);aspect-ratio:420/1180}
  .frame.ind{width:100%;aspect-ratio:300/772}
  .frame svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .zone{position:absolute;display:flex;flex-direction:row-reverse;justify-content:center;
        gap:3%;align-items:stretch;z-index:2}
  .frame.main .zone{left:21%;right:21%;top:20.5%;bottom:23%}
  .frame.ind  .zone{left:21.5%;right:21.5%;top:23%;bottom:22.5%}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
  .seg{font-family:var(--seg-font,var(--serif));color:var(--ink);line-height:1.02;text-align:center;
       writing-mode:vertical-rl;white-space:pre;font-size:var(--fs);font-weight:var(--seg-weight,400)}
  .seg.anchor{font-weight:var(--seg-weight,600)}
  .seg.gap{margin-top:.4em}
  .spacer{flex:1;min-height:.2em}

  .pvbar{position:fixed;left:0;right:0;bottom:0;display:none;align-items:center;gap:10px;
         padding:12px 18px;background:#fff;border-top:1px solid var(--line);z-index:50;
         box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .pvbar .pvlabel{font-weight:700;color:var(--sub)} .pvbar .pvsp{flex:1}
  body.preview .panel{display:none!important}
  body.preview .stage{padding:30px}
  body.preview .pvbar{display:flex}

  .precise{position:fixed;inset:0;background:#cfccc3;z-index:60;display:none;flex-direction:column}
  body.precise-on .precise{display:flex}
  body.precise-on{overflow:hidden}
  .precise .pbar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);
                 padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .precise .pbody{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .sheet{background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.18);position:relative;overflow:visible}
  .sheetcap{font-size:12px;color:var(--sub);margin-bottom:16px}
  .pwarn{background:#fff3f0;border:1px solid #e6b0a6;color:#8f2a20;padding:8px 12px;border-radius:8px;
         font-size:14px;max-width:640px}
  @media print{
    @page{margin:8mm}
    header,.panel{display:none!important}
    body{background:#fff;display:block;height:auto;overflow:visible}
    .main{display:block}
    .stage{display:block;overflow:visible;padding:0;background:#fff}
    .stageInner{display:flex;flex-wrap:wrap;gap:6mm;justify-content:flex-start;align-items:flex-start}
    .frame{break-inside:avoid}
    .frame.main{width:var(--print-w)!important}
    .frame.ind{width:var(--print-w)!important}
    body.precise-on header,body.precise-on .panel,body.precise-on .pvbar,body.precise-on .main{display:none!important}
    body.precise-on .precise{position:static!important;display:block!important;background:#fff}
    body.precise-on .precise .pbar{display:none!important}
    body.precise-on .precise .pbody{display:block!important;padding:0!important}
    body.precise-on .sheet{box-shadow:none!important;margin:0 auto 6mm!important;break-inside:avoid}
    body.precise-on .sheetcap,body.precise-on .pwarn{display:none!important}
  }
</style>

<style>
  html.gate-locked body > header, html.gate-locked body > .main,
  html.gate-locked body > .pvbar, html.gate-locked body > .precise { display:none !important; }
  html.gate-locked #easyToolsToggle, html.gate-locked #easyToolsPanel,
  html.gate-locked #hanjaPopup { display:none !important; }
  #gate{position:fixed;inset:0;z-index:99999;background:#e9e5db;display:none;
        align-items:center;justify-content:center;
        font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  html.gate-locked #gate{display:flex}
  .gate-card{background:#fff;border:1px solid #d8cfbe;border-radius:16px;padding:28px 26px;
             width:min(360px,90vw);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.15)}
  .gate-emblem{width:64px;height:64px;margin:0 auto 12px;display:block}
  .gate-title{font-size:20px;font-weight:800;color:#2b1d12;margin-bottom:4px}
  .gate-sub{font-size:14px;color:#7a6f63;margin-bottom:18px}
  #gateCode{width:100%;padding:13px;border:1px solid #c7bda9;border-radius:10px;
            font-size:17px;text-align:center;letter-spacing:.04em}
  #gateBtn{width:100%;margin-top:12px;padding:13px;border:none;border-radius:10px;
           background:#8f2a20;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  #gateBtn:disabled{opacity:.6;cursor:default}
  .gate-msg{min-height:20px;margin-top:12px;font-size:14px;color:#8f2a20;font-weight:600}
  .gate-foot{margin-top:14px;font-size:12px;color:#9b917f}
</style>
</head>
<body>
<script>document.documentElement.classList.add("gate-locked");</script>
<div id="gate">
  <div class="gate-card">
    <img class="gate-emblem" src="icon-192.png" alt="">
    <div class="gate-title">천도제 위패</div>
    <div class="gate-sub">사용 인증 코드를 입력하세요</div>
    <input id="gateCode" type="text" placeholder="인증 코드" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="gateBtn">확인</button>
    <div id="gateMsg" class="gate-msg"></div>
    <div class="gate-foot">코드는 관리자에게 문의하세요.</div>
  </div>
</div>
<header>
  <h1>천도제 위패 만들기</h1>
  <div class="modeTabs">
    <button class="modeTab on" data-mode="main">메인</button>
    <button class="modeTab" data-mode="ind">개인</button>
  </div>
  <span style="font-size:14px;color:var(--sub);margin-left:6px">도안</span>
  <div class="modeTabs">
    <button class="styleTab on" data-style="vector">벡터</button>
    <button class="styleTab" data-style="bold">원본(진)</button>
    <button class="styleTab" data-style="thin">원본(연)</button>
  </div>
  <span style="font-size:14px;color:var(--sub);margin-left:6px">글꼴</span>
  <select id="fontSel" class="hbtn" style="padding:8px 10px">
    <option value="">바탕(기본)</option>
    <option value="궁서">궁서</option>
    <option value="굴림">굴림</option>
    <option value="돋움">돋움</option>
    <option value="맑은 고딕">맑은 고딕</option>
  </select>
  <select id="weightSel" class="hbtn" style="padding:8px 10px">
    <option value="300">얇게</option>
    <option value="400" selected>보통</option>
    <option value="700">굵게</option>
    <option value="900">더 굵게</option>
  </select>
  <span class="sp"></span>
  <button class="hbtn" id="previewBtn">👁 미리보기</button>
  <button class="hbtn" id="preciseBtn">🔍 정밀 미리보기</button>
  <button class="hbtn" id="newBtn">새로 만들기</button>
  <button class="hbtn primary" id="printBtn">🖨 인쇄</button>
</header>

<div class="main">
  <div class="stage"><div class="stageInner" id="stageInner"></div></div>

  <div class="panel" id="panelMain">
    <div class="scroll">
      <div class="grp">
        <h2>메인 위패 내용</h2>
        <div class="fld"><label>사찰·신도명</label><input id="mTemple"></div>
        <div class="fld"><label>좌측 원문</label><input id="mLeft"></div>
        <div class="note">고정 글자(亡·행孝·伏爲·靈駕)는 자동으로 들어갑니다.</div>
      </div>
      <div class="grp">
        <h2>크기 · 인쇄</h2>
        <div class="fld"><label>가로(cm)</label><input id="mWidth" type="number" min="4" step="0.5"></div>
        <div class="fld"><label>세로(cm)</label><input id="mHeight" type="number" min="8" step="0.5"></div>
        <div class="note" id="mSizeNote" style="margin-bottom:8px"></div>
        <div class="row" style="margin-bottom:10px"><button class="btn" id="mFitA4">📄 A4 세로에 맞춤</button></div>
        <div class="row"><button class="btn big" id="mFsUp">글자＋</button><button class="btn big" id="mFsDown">글자－</button></div>
        <div class="note" style="margin-top:8px">가로·세로 중 하나만 바꿔도 비율에 맞춰 함께 조정됩니다. 실측 후 맞추세요.</div>
      </div>
    </div>
    <div class="footer"><button class="btn primary" id="mPrint">🖨 이 위패 인쇄</button></div>
  </div>

  <div class="panel" id="panelInd" style="display:none">
    <div class="scroll">
      <div class="grp">
        <h2>위패 목록</h2>
        <div class="chips" id="tabChips"></div>
        <div class="row">
          <button class="btn" id="addTablet">＋ 위패 추가</button>
          <button class="btn" id="delTablet">－ 위패 삭제</button>
          <button class="btn" id="dupTablet">복제</button>
        </div>
      </div>
      <div class="grp">
        <h2>제주(상주)</h2>
        <div class="fld"><label>관계</label><input id="cRel" placeholder="예: 子 / 女 / 孫子 / 제"></div>
        <div class="fld"><label>성</label><input id="cSur" placeholder="예: 김"></div>
        <div class="fld"><label>이름</label><input id="cGiv" placeholder="예: 갑순"></div>
      </div>
      <div class="grp">
        <h2>고인 (여러 명 가능)</h2>
        <div id="deadList"></div>
        <button class="btn" id="addDead">＋ 고인 추가</button>
      </div>
      <div class="grp">
        <h2>인쇄 배치 · 크기</h2>
        <div class="fld"><label>한 줄에</label>
          <button class="btn perrow on" data-n="3">3개</button>
          <button class="btn perrow" data-n="4">4개</button>
        </div>
        <div class="fld"><label>가로(cm)</label><input id="iWidth" type="number" min="3" step="0.5"></div>
        <div class="fld"><label>세로(cm)</label><input id="iHeight" type="number" min="6" step="0.5"></div>
        <div class="note" id="iSizeNote" style="margin-bottom:8px"></div>
        <div class="row"><button class="btn big" id="iFsUp">글자＋</button><button class="btn big" id="iFsDown">글자－</button></div>
      </div>
      <div class="note">미리보기에 모든 위패가 인쇄 배치 그대로 보입니다. 위패를 클릭하면 편집됩니다.</div>
    </div>
    <div class="footer"><button class="btn primary" id="iPrint">🖨 전체 인쇄</button></div>
  </div>
</div>

<div class="pvbar" id="pvbar">
  <span class="pvlabel">미리보기 — 인쇄될 모습입니다</span>
  <span class="pvsp"></span>
  <button class="hbtn" id="pvClose">✕ 편집으로</button>
  <button class="hbtn primary" id="pvPrint">🖨 인쇄 / PDF 저장</button>
</div>

<div class="precise" id="precise">
  <div class="pbar">
    <b>정밀 미리보기 (A4)</b>
    <span id="precInfo" class="note"></span>
    <span style="flex:1"></span>
    <button class="btn" id="precFit">📐 꽉 맞춤</button>
    <span style="font-size:13px;color:var(--sub)">정렬</span>
    <button class="btn" data-palign="start">왼쪽</button>
    <button class="btn" data-palign="center">가운데</button>
    <button class="btn" data-palign="end">오른쪽</button>
    <button class="btn" id="precOrient">↕ 세로/가로</button>
    <button class="hbtn" id="precClose">✕ 닫기</button>
    <button class="hbtn primary" id="precPrint">🖨 인쇄</button>
  </div>
  <div class="pbody" id="precBody"></div>
</div>

const FR = {
  vector:{
    main:{type:"svg",data:MAIN_SVG,ar:"420 / 1180",zone:{l:"21%",r:"21%",t:"20.5%",b:"23%"}},
    ind :{type:"svg",data:IND_SVG, ar:"300 / 772", zone:{l:"21.5%",r:"21.5%",t:"23%",b:"22.5%"}}
  },
  bold:{
    main:{type:"img",data:F_BOLD,ar:"853 / 1844",zone:{l:"16%",r:"20%",t:"22%",b:"19%"}},
    ind :{type:"img",data:F_BOLD,ar:"853 / 1844",zone:{l:"16%",r:"20%",t:"22%",b:"19%"}}
  },
  thin:{
    main:{type:"img",data:F_THIN,ar:"788 / 1997",zone:{l:"17%",r:"21.5%",t:"19.5%",b:"21%"}},
    ind :{type:"img",data:F_THIN,ar:"788 / 1997",zone:{l:"17%",r:"21.5%",t:"19.5%",b:"21%"}}
  }
};
function ratioMain(){const p=FR[S.style].main.ar.split("/").map(Number);return p[1]/p[0];}
function ratioInd(){const p=FR[S.style].ind.ar.split("/").map(Number);return p[1]/p[0];}
function makeFrame(mode){
  const cfg=FR[S.style][mode];
  const f=document.createElement("div"); f.className="frame "+mode+" "+S.style;
  f.style.aspectRatio=cfg.ar;
  if(cfg.type==="svg"){ f.innerHTML=cfg.data; }
  else { f.style.backgroundImage="url("+cfg.data+")"; f.style.backgroundSize="100% 100%"; f.style.backgroundRepeat="no-repeat"; f.style.backgroundColor="#fff"; }
  const z=document.createElement("div"); z.className="zone";
  z.style.left=cfg.zone.l; z.style.right=cfg.zone.r; z.style.top=cfg.zone.t; z.style.bottom=cfg.zone.b;
  return {f,z};
}

const S = {
  mode:"main", style:"vector", font:{fam:"", weight:400},
  main:{ temple:"자광사 신도일동", left:"유주무주 상세선망 조상", widthCm:18, fs:13, a4fit:true, autoFs:true, align:"center" },
  ind:{ perRow:3, widthCm:6, fs:9, sel:0, tablets:[ blankTablet() ], autoFs:true, align:"center" }
};
S.paper={orient:"portrait"};
function blankTablet(){
  return { chief:{rel:"子", sur:"김", giv:"갑순"},
           dead:[ {rel:"父", bongwan:"청풍", title:"후인", sur:"김", giv:"봉문"},
                  {rel:"母", bongwan:"신창", title:"유인", sur:"표", giv:"선봉"} ] };
}
function seg(t,cls){const d=document.createElement("div");d.className="seg"+(cls?" "+cls:"");d.textContent=t;return d;}
function splitSegs(str){return (str||"").trim().split(/\s+/).filter(Boolean);}
function colChief(c){
  const col=document.createElement("div");col.className="col";
  col.appendChild(seg("행孝","anchor"));
  if(c.rel)col.appendChild(seg(c.rel));
  if(c.sur)col.appendChild(seg(c.sur,"gap"));
  if(c.giv)col.appendChild(seg(c.giv));
  const sp=document.createElement("div");sp.className="spacer";col.appendChild(sp);
  col.appendChild(seg("伏爲","anchor"));return col;
}
function colDead(d){
  const col=document.createElement("div");col.className="col";
  col.appendChild(seg("亡","anchor"));
  if(d.rel)col.appendChild(seg(d.rel));
  const bt=((d.bongwan||"")+(d.title||"")).trim();
  if(bt)col.appendChild(seg(bt));
  if(d.sur)col.appendChild(seg(d.sur,"gap"));
  if(d.giv)col.appendChild(seg(d.giv));
  const sp=document.createElement("div");sp.className="spacer";col.appendChild(sp);
  col.appendChild(seg("靈駕","anchor"));return col;
}
function buildIndFrame(t,fs){
  const {f,z}=makeFrame("ind");
  f.style.setProperty("--fs",fs+"cqw");
  z.appendChild(colChief(t.chief));
  t.dead.forEach(d=>z.appendChild(colDead(d)));
  f.appendChild(z);return f;
}
function buildMainFrame(){
  const {f,z}=makeFrame("main");
  f.style.setProperty("--fs",S.main.fs+"cqw");
  const right=document.createElement("div");right.className="col";
  right.appendChild(seg("행孝","anchor"));
  right.appendChild(seg(S.main.temple));
  const sp1=document.createElement("div");sp1.className="spacer";right.appendChild(sp1);
  right.appendChild(seg("伏爲","anchor"));
  const left=document.createElement("div");left.className="col";
  left.appendChild(seg("亡","anchor"));
  left.appendChild(seg(S.main.left));
  const sp2=document.createElement("div");sp2.className="spacer";left.appendChild(sp2);
  left.appendChild(seg("靈駕","anchor"));
  z.appendChild(right);z.appendChild(left);
  f.appendChild(z);return f;
}

function r1(x){return Math.round(x*10)/10;}
function a4MainWidth(){
  const usableH=27.5, usableW=18.8; // A4 세로 인쇄영역(안전여백 포함) cm
  let w=usableH/ratioMain();
  if(w>usableW) w=usableW;
  return r1(w);
}
function applyA4Main(){
  S.main.a4fit=true; S.main.widthCm=a4MainWidth();
  const mw=document.getElementById("mWidth"), mh=document.getElementById("mHeight");
  if(mw) mw.value=r1(S.main.widthCm);
  if(mh) mh.value=r1(S.main.widthCm*ratioMain());
  render();
}
function updSizeNotes(){
  const mn=document.getElementById("mSizeNote");
  if(mn) mn.textContent="현재 약 "+r1(S.main.widthCm)+" × "+r1(S.main.widthCm*ratioMain())+" cm";
  const inn=document.getElementById("iSizeNote");
  if(inn) inn.textContent="한 장 약 "+r1(S.ind.widthCm)+" × "+r1(S.ind.widthCm*ratioInd())+" cm";
}
function fitFrame(f){
  var zone=f.querySelector(".zone"); if(!zone) return parseFloat(f.style.getPropertyValue("--fs"))||13;
  var fs=parseFloat(f.style.getPropertyValue("--fs"))||16, guard=0;
  while(guard++<90){
    var over=false, cols=zone.querySelectorAll(".col");
    for(var i=0;i<cols.length;i++){ if(cols[i].scrollHeight>zone.clientHeight+1){ over=true; break; } }
    if(!over||fs<=3) break;
    fs-=0.5; f.style.setProperty("--fs",fs+"cqw");
  }
  return fs;
}
const stageInner=document.getElementById("stageInner");
function render(){
  stageInner.innerHTML="";
  if(S.mode==="main"){
    const f=buildMainFrame();
    f.style.width=(S.main.widthCm*32)+"px";
    f.style.setProperty("--print-w",S.main.widthCm+"cm");
    f.style.setProperty("--fs",(S.main.autoFs?20:S.main.fs)+"cqw");
    stageInner.appendChild(f);stageInner.style.maxWidth="none";stageInner.style.width="";
    if(S.main.autoFs){ S.main.fs=fitFrame(f); }
  }else{
    const per=S.ind.perRow;
    const gap=16;
    let colW=Math.max(70, Math.round(S.ind.widthCm*32));
    stageInner.style.width=(per*colW+(per-1)*gap)+"px";
    stageInner.style.maxWidth="none";
    S.ind.tablets.forEach((t,i)=>{
      const f=buildIndFrame(t,S.ind.fs);
      f.style.flex="0 0 auto";
      f.style.width=colW+"px";
      f.style.setProperty("--print-w",S.ind.widthCm+"cm");
      f.style.setProperty("--fs",(S.ind.autoFs?16:S.ind.fs)+"cqw");
      f.style.outline=(i===S.ind.sel?"3px solid var(--accent)":"none");
      f.style.outlineOffset="4px";f.style.cursor="pointer";
      f.onclick=()=>{S.ind.sel=i;syncIndForm();render();};
      stageInner.appendChild(f);
      if(S.ind.autoFs) fitFrame(f);
    });
  }
  updSizeNotes();
}
function tabChipsRender(){
  const box=document.getElementById("tabChips");box.innerHTML="";
  S.ind.tablets.forEach((_,i)=>{
    const c=document.createElement("button");c.className="chip"+(i===S.ind.sel?" on":"");
    c.textContent="위패 "+(i+1);c.onclick=()=>{S.ind.sel=i;syncIndForm();render();};
    box.appendChild(c);});
}
function deadListRender(){
  const box=document.getElementById("deadList");box.innerHTML="";
  const t=S.ind.tablets[S.ind.sel];
  t.dead.forEach((d,idx)=>{
    const card=document.createElement("div");card.className="dead";
    const top=document.createElement("div");top.className="top";top.innerHTML=`<b>고인 ${idx+1}</b>`;
    const x=document.createElement("button");x.className="miniX";x.textContent="✕ 삭제";
    x.onclick=()=>{t.dead.splice(idx,1);deadListRender();render();};
    top.appendChild(x);card.appendChild(top);
    const mk=(lab,key,ph)=>{
      const fl=document.createElement("div");fl.className="fld";fl.innerHTML=`<label>${lab}</label>`;
      const inp=document.createElement("input");inp.value=d[key]||"";inp.placeholder=ph||"";
      inp.oninput=()=>{d[key]=inp.value;render();};fl.appendChild(inp);return fl;};
    card.appendChild(mk("관계","rel","예: 父 / 母 / 조부 / 조모"));
    card.appendChild(mk("본관","bongwan","예: 청풍 / 김해"));
    card.appendChild(mk("존칭","title","예: 후인 / 유인 / 공 / 학생"));
    card.appendChild(mk("성","sur","예: 김"));
    card.appendChild(mk("이름","giv","예: 봉문"));
    box.appendChild(card);});
}
function syncIndForm(){
  const t=S.ind.tablets[S.ind.sel];
  document.getElementById("cRel").value=t.chief.rel||"";
  document.getElementById("cSur").value=t.chief.sur||"";
  document.getElementById("cGiv").value=t.chief.giv||"";
  tabChipsRender();deadListRender();
}

document.querySelectorAll(".modeTab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".modeTab").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");S.mode=b.dataset.mode;
  document.getElementById("panelMain").style.display=S.mode==="main"?"flex":"none";
  document.getElementById("panelInd").style.display=S.mode==="ind"?"flex":"none";
  render();
});
const mTemple=document.getElementById("mTemple"),mLeft=document.getElementById("mLeft"),mWidth=document.getElementById("mWidth"),mHeight=document.getElementById("mHeight");
mTemple.value=S.main.temple;mLeft.value=S.main.left;
mWidth.value=r1(S.main.widthCm);mHeight.value=r1(S.main.widthCm*ratioMain());
mTemple.oninput=()=>{S.main.temple=mTemple.value;render();};
mLeft.oninput=()=>{S.main.left=mLeft.value;render();};
mWidth.oninput=()=>{S.main.a4fit=false;S.main.widthCm=parseFloat(mWidth.value)||18;mHeight.value=r1(S.main.widthCm*ratioMain());render();};
mHeight.oninput=()=>{S.main.a4fit=false;const h=parseFloat(mHeight.value)||50;S.main.widthCm=r1(h/ratioMain());mWidth.value=r1(S.main.widthCm);render();};

// 개인 위패: '한 줄에 N개'가 A4 한 장에 딱 맞도록 용지 방향과 위패 가로를 계산.
// 3개 이하 = A4 세로, 4개 이상 = A4 가로. 한 줄에 N개가 정확히 한 페이지에 들어간다.
function fitIndForPrint(){
  var per=S.ind.perRow||3, m=8, g=6;
  var land=per>=4;
  S.paper.orient=land?"landscape":"portrait";
  var Wmm=land?297:210, Hmm=land?210:297;
  var uW=Wmm-2*m, uH=Hmm-2*m;
  var w=Math.min((uW-(per-1)*g)/per, uH/ratioInd());
  S.ind.widthCm=Math.max(2, Math.floor(w)/10);     // 0.1cm 단위로 내림 → 반올림 초과 방지
  var iw=document.getElementById("iWidth"), ih=document.getElementById("iHeight");
  if(iw) iw.value=r1(S.ind.widthCm);
  if(ih) ih.value=r1(S.ind.widthCm*ratioInd());
}
function renderPrecise(){
  const body=document.getElementById("precBody"); body.innerHTML="";
  const port=S.paper.orient==="portrait";
  const Wmm=port?210:297, Hmm=port?297:210, margin=8, gap=6;
  const usableW=Wmm-2*margin, usableH=Hmm-2*margin;
  const isMain=S.mode==="main";
  const tabWmm=(isMain?S.main.widthCm:S.ind.widthCm)*10;
  const tabHmm=tabWmm*(isMain?ratioMain():ratioInd());
  let cols=isMain?1:Math.max(1,Math.min(S.ind.perRow,Math.floor((usableW+gap)/(tabWmm+gap))));
  let rows=Math.max(1,Math.floor((usableH+gap)/(tabHmm+gap)));
  const perPage=Math.max(1,cols*rows);
  const items=isMain?[null]:S.ind.tablets;
  const total=items.length;
  const pages=Math.max(1,Math.ceil(total/perPage));
  document.getElementById("precInfo").textContent=
    `A4 ${Wmm}×${Hmm}mm(인쇄영역 ${r1(usableW/10)}×${r1(usableH/10)}cm) · 위패 ${r1(tabWmm/10)}×${r1(tabHmm/10)}cm · 한 장 ${cols}×${rows}=${perPage}개 · 총 ${pages}쪽`;
  if(tabHmm>usableH||tabWmm>usableW){
    const w=document.createElement("div");w.className="pwarn";
    w.textContent=`⚠ 이 위패(${r1(tabWmm/10)}×${r1(tabHmm/10)}cm)는 A4 ${port?"세로":"가로"} 인쇄영역(${r1(usableW/10)}×${r1(usableH/10)}cm)보다 큽니다. 크기를 줄이거나 더 큰 용지를 쓰세요. (가로 전환도 시도해보세요)`;
    body.appendChild(w);
  } else if(!isMain && S.ind.perRow>cols){
    const w=document.createElement("div");w.className="pwarn";
    w.textContent=`⚠ 폭이 부족해 한 줄에 ${cols}개만 들어갑니다(요청 ${S.ind.perRow}개). 위패 가로를 줄이거나 A4 가로로 전환하세요.`;
    body.appendChild(w);
  }
  // 인쇄 전용 스타일: 화면 미리보기는 px 비율로 축소해 보여주지만,
  // 실제 인쇄는 mm 단위로 A4에 딱 맞게 (용지 방향 포함) 출력되도록 강제한다.
  var pageStyle=document.getElementById("precPageStyle");
  if(!pageStyle){pageStyle=document.createElement("style");pageStyle.id="precPageStyle";document.head.appendChild(pageStyle);}
  var pJustify=(isMain?S.main.align:S.ind.align)||"center";
  pageStyle.textContent=
    "@page{size:A4 "+(port?"portrait":"landscape")+";margin:"+margin+"mm}"+
    "@media print{"+
      "body.precise-on .precise .pbody{gap:0!important;padding:0!important}"+
      "body.precise-on .sheet{width:"+usableW+"mm!important;height:"+usableH+"mm!important;padding:0!important;"+
        "grid-template-columns:repeat("+cols+","+tabWmm+"mm)!important;grid-auto-rows:"+tabHmm+"mm!important;"+
        "gap:"+gap+"mm!important;justify-content:"+pJustify+"!important;align-content:start!important;"+
        "box-shadow:none!important;margin:0!important;overflow:hidden;break-after:page;page-break-after:always}"+
      "body.precise-on .sheet:last-of-type{break-after:auto;page-break-after:auto}"+
      "body.precise-on .frame.ind,body.precise-on .frame.main{width:"+tabWmm+"mm!important;max-width:none!important}"+
    "}";
  const avail=Math.min(window.innerWidth-80, port?560:760);
  const scale=avail/Wmm;
  for(let p=0;p<pages;p++){
    const sheet=document.createElement("div");sheet.className="sheet";
    sheet.style.width=(Wmm*scale)+"px";sheet.style.height=(Hmm*scale)+"px";
    sheet.style.padding=(margin*scale)+"px";sheet.style.display="grid";
    sheet.style.gridTemplateColumns=`repeat(${cols}, ${tabWmm*scale}px)`;
    sheet.style.gridAutoRows=(tabHmm*scale)+"px";
    sheet.style.gap=(gap*scale)+"px";
    sheet.style.alignContent="center";sheet.style.justifyContent=(isMain?S.main.align:S.ind.align);
    const slice=isMain?[null]:items.slice(p*perPage,(p+1)*perPage);
    slice.forEach(t=>{
      const f=isMain?buildMainFrame():buildIndFrame(t,S.ind.fs);
      f.style.width=(tabWmm*scale)+"px";f.style.outline="none";f.style.cursor="default";f.onclick=null;
      sheet.appendChild(f);
    });
    body.appendChild(sheet);
    const cap=document.createElement("div");cap.className="sheetcap";
    cap.textContent=`A4 ${port?"세로":"가로"} · ${Wmm}×${Hmm}mm  (${p+1}/${pages}쪽)`;
    body.appendChild(cap);
  }
}

var FONTS={"궁서":'"Gungsuh","궁서",serif',"굴림":'"Gulim","굴림",sans-serif',"돋움":'"Dotum","돋움",sans-serif',"맑은 고딕":'"Malgun Gothic","맑은 고딕",sans-serif'};
function applyFont(){
  var root=document.documentElement;
  if(S.font.fam){ root.style.setProperty("--seg-font", S.font.fam); } else { root.style.removeProperty("--seg-font"); }
  if(S.font.weight && S.font.weight!==400){ root.style.setProperty("--seg-weight", S.font.weight); } else { root.style.removeProperty("--seg-weight"); }
}
(function(){
  var fsel=document.getElementById("fontSel"), wsel=document.getElementById("weightSel");
  if(fsel) fsel.onchange=function(){ S.font.fam=FONTS[fsel.value]||""; applyFont(); render(); };
  if(wsel) wsel.onchange=function(){ S.font.weight=parseInt(wsel.value)||400; applyFont(); render(); };
  var pf=document.getElementById("precFit");
  if(pf) pf.onclick=function(){
    var port=S.paper.orient==="portrait";
    var Wmm=port?210:297, Hmm=port?297:210, margin=8, gap=6;
    var uW=Wmm-2*margin, uH=Hmm-2*margin, w;
    if(S.mode==="main"){
      w=Math.min(uW, uH/ratioMain()); S.main.widthCm=r1(w/10); S.main.a4fit=false;
      var mw=document.getElementById("mWidth"), mh=document.getElementById("mHeight");
      if(mw)mw.value=r1(S.main.widthCm); if(mh)mh.value=r1(S.main.widthCm*ratioMain());
    } else {
      fitIndForPrint();   // 한 줄에 N개 → A4 방향+가로 자동 계산(3개=세로, 4개=가로)
    }
    render(); renderPrecise();
  };
  var pas=document.querySelectorAll("[data-palign]");
  for(var i=0;i<pas.length;i++){ (function(b){ b.onclick=function(){ if(S.mode==="main")S.main.align=b.dataset.palign; else S.ind.align=b.dataset.palign; renderPrecise(); }; })(pas[i]); }
})();
applyFont();
syncIndForm();applyA4Main();render();
(function(){function _refit(){render();}
  if(typeof requestAnimationFrame!=="undefined"){requestAnimationFrame(function(){requestAnimationFrame(_refit);});}
  window.addEventListener("load",_refit);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(_refit);}
})();
</script>
<script>
(function(){
  var html=document.documentElement;
  var msg=document.getElementById("gateMsg");
  var btn=document.getElementById("gateBtn");
  var input=document.getElementById("gateCode");
  function unlock(){ html.classList.remove("gate-locked"); }
  function fail(t){ msg.textContent=t; }

  // 이미 이 기기에서 인증되었으면 오프라인에서도 바로 열기
  if(localStorage.getItem("wipae_verified")==="1"){ unlock(); return; }

  var ready=false, auth=null, db=null;
  try{
    if(!window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.projectId){
      fail("설정 필요: 관리자에게 문의하세요."); 
    } else {
      firebase.initializeApp(window.FIREBASE_CONFIG);
      auth=firebase.auth(); db=firebase.firestore();
      auth.signInAnonymously().then(function(){ ready=true; })
        .catch(function(){ fail("인증 서버 연결 실패 — 인터넷을 확인하세요."); });
    }
  }catch(e){ fail("초기화 오류 — 관리자에게 문의하세요."); }

  function claim(){
    var code=(input.value||"").trim();
    if(!code){ fail("코드를 입력하세요."); return; }
    if(!ready || !auth || !auth.currentUser){ fail("잠시 후 다시 시도하세요 (서버 준비 중)."); return; }
    btn.disabled=true; fail("확인 중...");
    var uid=auth.currentUser.uid;
    db.runTransaction(function(t){
      var ref=db.collection("codes").doc(code);
      return t.get(ref).then(function(snap){
        if(!snap.exists) return Promise.reject("invalid");
        var d=snap.data()||{};
        if(d.claimedBy && d.claimedBy!==uid) return Promise.reject("used");
        t.set(ref,{claimedBy:uid, claimedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
        return null;
      });
    }).then(function(){
      localStorage.setItem("wipae_verified","1");
      localStorage.setItem("wipae_code",code);
      msg.textContent=""; unlock();
    }).catch(function(err){
      if(err==="invalid") fail("등록되지 않은 코드입니다.");
      else if(err==="used") fail("이미 다른 기기에서 사용 중인 코드입니다.");
      else fail("오류가 발생했습니다 — 인터넷/설정을 확인하세요.");
    }).finally(function(){ btn.disabled=false; });
  }
  btn.addEventListener("click", claim);
  input.addEventListener("keydown", function(e){ if(e.key==="Enter") claim(); });
})();
</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(reg){
      function check(){ try{ if(reg.update) reg.update(); }catch(e){} }
      check();
      // 앱이 다시 화면에 보일 때 + 30분마다 새 버전 확인 → 설치된 앱도 자동으로 최신화
      setInterval(check, 30*60*1000);
      document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") check(); });
    }).catch(function(){});
  });
  var _wipaeReloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(_wipaeReloaded) return; _wipaeReloaded=true;
    // 새 버전이 적용되기 직전, 작성 중인 내용을 임시 저장했다가 새로고침 후 복원한다.
    try{ if(window.__wipaeStashState) window.__wipaeStashState(); }catch(e){}
    location.reload();
  });
}
