<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>위패 작성기 1차 검토본 - 도안 포함</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f1eb}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body><iframe id="app" src="simple.html" title="위패 작성기"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d)return;
  d.title='위패 작성기 - 도안 포함 검토본';
  const style=d.createElement('style');
  style.textContent=`
    .paper{background:#f7f1e3!important;border:0!important;overflow:visible!important;isolation:isolate}
    .paper::before{content:"";position:absolute;inset:-4% -8% -7%;background:url('wipae-frame.svg') center/100% 100% no-repeat;z-index:0;pointer-events:none}
    .vertical{position:relative;z-index:2;max-height:65%;margin-top:-4%;}
    .tag{z-index:3}
    @media print{#paper{overflow:visible!important;background:#f7f1e3!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}#paper::before{content:""!important;display:block!important;position:absolute!important;inset:-4% -8% -7%!important;background:url('wipae-frame.svg') center/100% 100% no-repeat!important;z-index:0!important}.vertical{position:relative!important;z-index:2!important}}
  `;
  d.head.appendChild(style);
  const h=d.querySelector('header small'); if(h)h.textContent='간편 1차 버전 · 위패 도안 포함 · 로컬 저장';
});
</script></body></html>
