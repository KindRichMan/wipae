<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>위패 작성기 - 간편 1차 버전</title>
<style>
:root{--bg:#f4f1eb;--panel:#fff;--line:#ddd5c8;--ink:#2c241d;--muted:#776b60;--accent:#5c4434;--soft:#efe9df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:#2d241e;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{margin:0;font-size:22px}header small{opacity:.78}
main{max-width:1380px;margin:auto;padding:18px;display:grid;grid-template-columns:390px 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 9px #00000008}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:20px 0 9px;color:var(--muted)}label{font-weight:700;display:block;margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:#fff}textarea{min-height:92px;resize:vertical}.row{display:flex;gap:8px}.row>*{flex:1}.btn{border:0;border-radius:9px;padding:11px 12px;background:var(--accent);color:white;font-weight:700}.btn.secondary{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#833e34}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.notice{font-size:12px;color:var(--muted);line-height:1.55}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.quick button{border:1px solid var(--line);border-radius:8px;background:white;padding:8px 2px;font-size:20px}.result{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}.result b{font-size:21px}.result small{display:block;color:var(--muted);margin-top:2px;line-height:1.35}.result .btn{padding:7px 10px}.empty{color:var(--muted);font-size:13px}
.workspace{display:grid;grid-template-columns:minmax(430px,1fr) 300px;gap:18px}.previewbox{background:#e7e1d8;border-radius:12px;min-height:720px;display:flex;align-items:center;justify-content:center;padding:26px;overflow:auto}.paper{background:white;box-shadow:0 4px 18px #0002;display:flex;align-items:center;justify-content:center;position:relative;border:1px solid #ddd;transition:.15s}.vertical{writing-mode:vertical-rl;text-orientation:upright;white-space:pre-wrap;text-align:center;font-family:"Batang","Noto Serif CJK KR","Yu Mincho",serif;font-weight:600;line-height:1.08}.tag{position:absolute;left:7px;bottom:5px;color:#bbb;font-size:9px}.range{display:grid;grid-template-columns:82px 1fr 46px;gap:8px;align-items:center;margin:10px 0}.range input{padding:0}.saved{display:flex;gap:7px;margin:7px 0}.saved .load{flex:1;text-align:left}.saved .del{width:55px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.sizegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:1000px){main{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.previewbox{min-height:560px}}
@media print{body *{visibility:hidden!important}#paper,#paper *{visibility:visible!important}#paper{position:absolute;left:50%;top:0;transform:translateX(-50%);box-shadow:none;border:0}.tag{display:none!important}@page{size:A4 portrait;margin:0}}
</style>
</head>
<body>
<header><div><h1>위패 작성기</h1><small>간편 1차 버전 · 로컬 저장</small></div><div>인터넷 없이 작성 · 저장 · 인쇄</div></header>
<main>
<section class="panel">
<h2>1. 위패 내용 작성</h2>
<label>기본 양식</label>
<select id="template"><option value="custom">직접 작성</option><option value="father">부친 기본</option><option value="mother">모친 기본</option><option value="general">일반 영가</option></select>
<label>이름 또는 본문</label>
<textarea id="text" placeholder="예: 洪吉童 또는 필요한 전체 문구"></textarea>
<div class="actions"><button class="btn" id="applyTemplate">양식 적용</button><button class="btn secondary" id="newTablet">새 위패</button></div>
<h3>자주 쓰는 한자·단어</h3><div class="quick" id="quick"></div>
<label>한글/한자 검색</label><input id="search" placeholder="예: 아버지, 어머니, 신위, 현고, 영가"><div id="results"></div>
<h3>현재 위패 저장</h3><input id="saveName" placeholder="예: 부친 기본 위패"><button class="btn" id="saveCurrent" style="width:100%;margin-top:8px">자주 쓰는 위패로 저장</button>
<h3>백업 / 복원</h3><div class="row"><button class="btn secondary" id="backup">자료 백업하기</button><button class="btn secondary" id="restoreBtn">자료 불러오기</button></div><input id="restoreFile" type="file" accept="application/json,.json" hidden>
<p class="notice">저장한 위패와 편집 설정은 이 브라우저에만 보관됩니다. 브라우저 데이터 삭제나 PC 교체에 대비해 가끔 「자료 백업하기」를 눌러 JSON 파일을 보관해 주세요.</p>
</section>
<section class="panel"><div class="workspace">
<div><div class="toolbar"><button class="btn" id="print">인쇄 / PDF 저장</button><button class="btn secondary" id="autoFit">글자 자동 맞춤</button><button class="btn secondary" id="resetLayout">배치 초기화</button></div><div class="previewbox"><div class="paper" id="paper"><div class="vertical" id="vertical"></div><div class="tag">미리보기</div></div></div></div>
<aside><h2>2. 크기와 배치</h2><div class="sizegrid"><div><label>위패 가로(mm)</label><input id="paperW" type="number" min="40" max="190" step="1" value="70"></div><div><label>위패 세로(mm)</label><input id="paperH" type="number" min="100" max="280" step="1" value="210"></div></div>
<div class="range"><span>글자 크기</span><input id="fontSize" type="range" min="24" max="82" value="50"><output id="fontSizeOut">50</output></div><div class="range"><span>글자 간격</span><input id="spacing" type="range" min="0" max="28" value="8"><output id="spacingOut">8</output></div><div class="range"><span>좌우 위치</span><input id="moveX" type="range" min="-70" max="70" value="0"><output id="moveXOut">0</output></div><div class="range"><span>상하 위치</span><input id="moveY" type="range" min="-140" max="140" value="0"><output id="moveYOut">0</output></div>
<h3>저장된 위패</h3><div id="savedList"></div></aside>
</div></section>
</main>
<script>
const DB=[
['故','고','돌아가신, 고인','고 돌아가신 고인 사망'],['顯','현','높여 드러내어 부르는 표현','현 높임'],['考','고','돌아가신 아버지','고 아버지 부친'],['妣','비','돌아가신 어머니','비 어머니 모친'],['顯考','현고','돌아가신 아버지를 높여 부름','현고 아버지 부친'],['顯妣','현비','돌아가신 어머니를 높여 부름','현비 어머니 모친'],['父','부','아버지','부 아버지'],['母','모','어머니','모 어머니'],['祖父','조부','할아버지','조부 할아버지'],['祖母','조모','할머니','조모 할머니'],['曾祖父','증조부','증조할아버지','증조부 증조할아버지'],['曾祖母','증조모','증조할머니','증조모 증조할머니'],['先祖','선조','조상','선조 조상'],['夫','부','남편','남편 배우자'],['妻','처','아내','아내 배우자'],['子','자','아들','아들 자'],['女','녀','딸','딸 녀 여'],['孫子','손자','손자','손자'],['孫女','손녀','손녀','손녀'],['兄','형','형','형'],['弟','제','남동생, 아우','동생 아우'],['姉','자','누나, 언니','누나 언니'],['妹','매','여동생','여동생'],['後人','후인','뒤를 잇는 사람','후인'],['孺人','유인','여성 고인에게 쓰이는 전통적 존칭','유인 여성 존칭'],['學生','학생','전통 위패에서 쓰이는 존칭 표현','학생 존칭'],['處士','처사','전통적 남성 존칭','처사 남성 존칭'],['公','공','높임 표현','공 높임'],['大夫人','대부인','여성 어른 존칭','대부인 여성 존칭'],['府君','부군','남성 고인을 높여 부르는 표현','부군 남성 존칭'],['神位','신위','신령을 모시는 자리','신위 위패'],['靈位','영위','영혼을 모시는 자리','영위 영혼 위패'],['靈駕','영가','영혼을 높여 이르는 말','영가 영혼'],['之靈','지령','~의 영혼','지령 영혼'],['亡','망','돌아가심','망 사망'],['靈','령','영혼, 영가','령 영혼 영가'],['位','위','자리, 위','위 자리'],['伏爲','복위','삼가 위하여','복위 위하여'],['孝','효','효도','효'],['薦度','천도','망자를 좋은 곳으로 인도함','천도 천도재 천도제'],['薦度齋','천도재','망자의 극락왕생을 기원하는 의식','천도재 천도제'],['極樂往生','극락왕생','극락에 다시 태어남','극락왕생'],['金','김','김씨 성','김 성씨'],['李','이','이씨 성','이 성씨'],['朴','박','박씨 성','박 성씨'],['崔','최','최씨 성','최 성씨'],['鄭','정','정씨 성','정 성씨'],['姜','강','강씨 성','강 성씨'],['趙','조','조씨 성','조 성씨'],['尹','윤','윤씨 성','윤 성씨'],['張','장','장씨 성','장 성씨'],['林','임','임씨 성','임 성씨'],['韓','한','한씨 성','한 성씨'],['吳','오','오씨 성','오 성씨'],['徐','서','서씨 성','서 성씨'],['申','신','신씨 성','신 성씨'],['權','권','권씨 성','권 성씨'],['黃','황','황씨 성','황 성씨'],['安','안','안씨 성','안 성씨'],['宋','송','송씨 성','송 성씨'],['全','전','전씨 성','전 성씨'],['洪','홍','홍씨 성','홍 성씨'],['柳','유','유씨 성','유 성씨'],['高','고','고씨 성','고 성씨'],['文','문','문씨 성','문 성씨'],['梁','양','양씨 성','양 성씨'],['孫','손','손씨 성','손 성씨'],['白','백','백씨 성','백 성씨'],['許','허','허씨 성','허 성씨']
].map(([t,r,m,k])=>({t,r,m,k}));
const QUICK=['故','顯考','顯妣','府君','孺人','神位','靈位','靈駕','之靈','亡','伏爲','極樂往生'];
const STORE='wipae.simple.v1'; const SETTINGS='wipae.simple.settings.v1'; const $=q=>document.querySelector(q); const text=$('#text'), vertical=$('#vertical');
function saved(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return[]}}function saveAll(v){localStorage.setItem(STORE,JSON.stringify(v));renderSaved()}
function settings(){try{return JSON.parse(localStorage.getItem(SETTINGS)||'{}')}catch{return{}}}function setSettings(){localStorage.setItem(SETTINGS,JSON.stringify({paperW:+$('#paperW').value,paperH:+$('#paperH').value,fontSize:+$('#fontSize').value,spacing:+$('#spacing').value,moveX:+$('#moveX').value,moveY:+$('#moveY').value}))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function insert(v){const a=text.selectionStart??text.value.length,b=text.selectionEnd??a;text.value=text.value.slice(0,a)+v+text.value.slice(b);text.focus();text.selectionStart=text.selectionEnd=a+v.length;autoFit(false);render()}
function renderQuick(){ $('#quick').innerHTML=QUICK.map(x=>`<button type="button" data-v="${x}">${x}</button>`).join('');$('#quick').querySelectorAll('button').forEach(b=>b.onclick=()=>insert(b.dataset.v)) }
function search(){const q=$('#search').value.trim().toLowerCase();if(!q){$('#results').innerHTML='';return}const found=DB.filter(x=>(x.t+' '+x.r+' '+x.m+' '+x.k).toLowerCase().includes(q)).slice(0,12);$('#results').innerHTML=found.length?found.map((x,i)=>`<div class="result"><div><b>${x.t}</b><small>${x.r} · ${x.m}</small></div><button class="btn secondary" data-i="${i}">사용</button></div>`).join(''):'<div class="empty">검색 결과가 없습니다. 직접 입력할 수도 있습니다.</div>';$('#results').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>insert(found[i].t))}
function autoSize(){const n=[...text.value.replace(/\s/g,'')].length;if(!n)return 50;if(n<=5)return 68;if(n<=8)return 58;if(n<=12)return 50;if(n<=16)return 42;if(n<=22)return 35;return 30}
function autoFit(doRender=true){$('#fontSize').value=autoSize();$('#spacing').value=[...text.value.replace(/\s/g,'')].length>16?4:8;if(doRender)render()}
function render(){vertical.textContent=text.value;vertical.style.fontSize=$('#fontSize').value+'px';vertical.style.letterSpacing=$('#spacing').value+'px';vertical.style.transform=`translate(${$('#moveX').value}px,${$('#moveY').value}px)`;const w=+$('#paperW').value,h=+$('#paperH').value;$('#paper').style.width=Math.round(w*3.15)+'px';$('#paper').style.height=Math.round(h*3.15)+'px';$('#paper').style.setProperty('--print-w',w+'mm');$('#paper').style.setProperty('--print-h',h+'mm');['fontSize','spacing','moveX','moveY'].forEach(id=>$('#'+id+'Out').value=$('#'+id).value);setSettings()}
function applyTemplate(){const type=$('#template').value;let name=text.value.trim();if(type==='father')text.value=`顯考${name||'○○○'}神位`;else if(type==='mother')text.value=`顯妣${name||'○○○'}神位`;else if(type==='general')text.value=`故${name||'○○○'}靈位`;autoFit()}
function current(){return{id:Date.now(),name:$('#saveName').value.trim()||'이름 없는 위패',text:text.value,template:$('#template').value,paperW:+$('#paperW').value,paperH:+$('#paperH').value,fontSize:+$('#fontSize').value,spacing:+$('#spacing').value,moveX:+$('#moveX').value,moveY:+$('#moveY').value,savedAt:new Date().toISOString()}}
function saveCurrent(){if(!text.value.trim()){alert('저장할 위패 내용을 먼저 입력해주세요.');return}const a=saved();a.unshift(current());saveAll(a);$('#saveName').value='';alert('위패를 저장했습니다.')}
function load(id){const x=saved().find(v=>v.id===id);if(!x)return;text.value=x.text;$('#template').value=x.template||'custom';['paperW','paperH','fontSize','spacing','moveX','moveY'].forEach(k=>$('#'+k).value=x[k]??$('#'+k).value);render()}
function del(id){if(confirm('이 저장 위패를 삭제할까요?'))saveAll(saved().filter(v=>v.id!==id))}
function renderSaved(){const a=saved();$('#savedList').innerHTML=a.length?a.map(x=>`<div class="saved"><button class="btn secondary load" data-id="${x.id}">${esc(x.name)}</button><button class="btn danger del" data-id="${x.id}">삭제</button></div>`).join(''):'<div class="empty">아직 저장된 위패가 없습니다.</div>';$('#savedList').querySelectorAll('.load').forEach(b=>b.onclick=()=>load(+b.dataset.id));$('#savedList').querySelectorAll('.del').forEach(b=>b.onclick=()=>del(+b.dataset.id))}
function backup(){const payload={app:'wipae-simple',version:1,exportedAt:new Date().toISOString(),savedTablets:saved(),settings:settings()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a'),d=new Date();a.href=URL.createObjectURL(blob);a.download=`위패자료_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(file){const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(p.app!=='wipae-simple'||!Array.isArray(p.savedTablets))throw Error();if(!confirm(`백업에 저장된 위패 ${p.savedTablets.length}개를 불러올까요? 현재 저장 자료는 백업 내용으로 바뀝니다.`))return;localStorage.setItem(STORE,JSON.stringify(p.savedTablets));if(p.settings)localStorage.setItem(SETTINGS,JSON.stringify(p.settings));applyStoredSettings();renderSaved();render();alert('자료를 불러왔습니다.')}catch{alert('올바른 위패 백업 파일이 아닙니다.')}};r.readAsText(file,'utf-8')}
function applyStoredSettings(){const s=settings();['paperW','paperH','fontSize','spacing','moveX','moveY'].forEach(k=>{if(s[k]!=null)$('#'+k).value=s[k]})}
$('#search').oninput=search;$('#applyTemplate').onclick=applyTemplate;$('#newTablet').onclick=()=>{text.value='';$('#template').value='custom';$('#saveName').value='';$('#moveX').value=0;$('#moveY').value=0;autoFit()};$('#saveCurrent').onclick=saveCurrent;$('#backup').onclick=backup;$('#restoreBtn').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=e=>{if(e.target.files[0])restore(e.target.files[0]);e.target.value=''};$('#print').onclick=()=>window.print();$('#autoFit').onclick=()=>autoFit();$('#resetLayout').onclick=()=>{$('#fontSize').value=50;$('#spacing').value=8;$('#moveX').value=0;$('#moveY').value=0;render()};text.oninput=()=>{autoFit(false);render()};['paperW','paperH','fontSize','spacing','moveX','moveY'].forEach(id=>$('#'+id).oninput=render);
const printStyle=document.createElement('style');printStyle.id='dynamicPrint';document.head.appendChild(printStyle);function updatePrint(){printStyle.textContent=`@media print{#paper{width:${+$('#paperW').value}mm!important;height:${+$('#paperH').value}mm!important}}`}['paperW','paperH'].forEach(id=>$('#'+id).addEventListener('input',updatePrint));
renderQuick();applyStoredSettings();renderSaved();render();updatePrint();
</script>
</body></html>
